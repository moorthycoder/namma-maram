<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Tree Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/tree-profile.css" />
</head>
<body>
<div class="screen">
  <div class="status-bar blue" id="sbar"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>

  <!-- TREE PROFILE -->
  <div class="page active" id="page-profile">
    <div id="header">
      <div class="topbar"><button class="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i></button><span class="topbar-title" id="profile-id-label"></span><span class="s-7a060d"><button class="add-sponsor-btn" type="button" onclick="addToSponsor()" title="Sponsor this tree"><i class="ti ti-currency-rupee"></i></button><button class="add-care-btn" type="button" onclick="addToCare()" title="Care for this tree"><i class="ti ti-heart-handshake"></i></button><button class="add-watch-btn" type="button" onclick="addToWatch()" title="Watch this tree"><i class="ti ti-telescope"></i></button><button class="add-survey-btn" type="button" onclick="addToSurveyRequest()" title="Request survey for this tree"><i class="ti ti-clipboard-list"></i></button><button class="add-report-btn" type="button" onclick="addToComplaint()" title="Report issue"><i class="ti ti-phone"></i></button></span></div>
      <div class="hero"><div class="s-807f89"></div><div class="hero-overlay"></div><div class="hero-title"><h1 id="profile-hero-title"></h1><p class="profile-hero-addr" class="profile-hero-addr" id="profile-hero-addr"></p></div></div>
    </div>
    <div class="scrollable s-35ac28">
      <div class="stats-row"><div class="stat-card"><div class="stat-label">Health</div><div class="stat-value" id="profile-stat-health">healthy</div></div><div class="stat-card"><div class="stat-label">Height</div><div class="stat-value"><span id="profile-stat-height">8.4</span> <span class="stat-unit unit-label" data-unit-type="height">feet</span></div></div><div class="stat-card"><div class="stat-label">Diameter</div><div class="stat-value"><span id="profile-stat-diam">22</span> <span class="stat-unit unit-label" data-unit-type="diameter">feet</span></div></div></div>
      <div class="health-bar-wrap"><div class="health-label"><span>Health score</span><span id="profile-health-score" class="s-e9ddd4">82 / 100</span></div><div class="health-bar"><div class="health-fill"></div></div></div>
      <div id="display-data">
        <div class="section-title">Tree info</div>
        <div class="info-card s-157a9c">
          <div class="info-row"><span class="info-key"><i class="ti ti-leaf s-9bdb4a"></i>Species name</span><span class="info-val species-val"><span id="profile-species">—</span><span class="details-link species-see-more" onclick="openMoreDetails()">See more...</span></span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-user s-9bdb4a"></i>Registered by</span><span class="info-val" id="profile-registered-by">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-id s-9bdb4a"></i>User id</span><span class="info-val" id="profile-user-id">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-calendar s-9bdb4a"></i>Registered Date</span><span class="info-val" id="profile-registered-date">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-plant-2 s-9bdb4a"></i>Planted date</span><span class="info-val" id="profile-planted-date">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-hourglass s-9bdb4a"></i>Age</span><span class="info-val" id="profile-age">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-clipboard-list s-9bdb4a"></i>Total logs</span><span class="info-val" id="profile-total-logs">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-building s-9bdb4a"></i>Project</span><ul class="project-info-list" id="profile-project"></ul></div>
        </div>
        <div class="section-title">Growth logs</div>
        <div class="info-card">
          <div class="profile-logs" class="profile-logs" id="profile-logs"></div>
        </div>
      </div>
      <div class="s-b23b11"><i class="ti ti-hand-click s-8b8072"></i> Tap a log to view photos</div>
      <button class="sponsor-cta" type="button" onclick="addToSponsor()"><i class="ti ti-currency-rupee"></i> Sponsor this tree</button>
      <button class="care-cta" type="button" onclick="addToCare()"><i class="ti ti-heart-handshake"></i> Care for this tree</button>
      <button class="watch-cta" type="button" onclick="addToWatch()"><i class="ti ti-telescope"></i> Watch this tree</button>
      <button class="survey-cta" type="button" onclick="addToSurveyRequest()"><i class="ti ti-clipboard-list"></i> Request survey for this tree</button>
      <button class="report-cta" type="button" onclick="openComplaintPage()"><i class="ti ti-phone"></i> Report issue</button>
    </div>
  </div>

  <!-- PHOTO FULLSCREEN MODAL -->
  <div class="map-modal-back photo-modal" id="photo-modal" onclick="closePhotoModal()"><button class="photo-close-btn" type="button" onclick="event.stopPropagation(); closePhotoModal()"><i class="ti ti-x"></i></button><div id="photo-modal-emoji" class="photo-modal-emoji"></div></div>

  <!-- TREE MAP FULLSCREEN MODAL -->
  <div class="map-modal-back" id="map-modal">
    <div class="map-modal-head">
      <button class="back-btn" onclick="closeMapModal()"><i class="ti ti-arrow-left"></i></button>
      <span class="topbar-title">Tree map</span>
    </div>
    <iframe class="map-frame" id="map-frame" title="Tree map"></iframe>
  </div>

  <!-- ACTION MODAL -->
  <div class="report-modal-back" id="action-modal">
    <div class="report-success-sheet">
      <div class="report-success-icon" id="action-modal-icon"><i class="ti ti-check"></i></div>
      <div class="report-success-title" id="action-modal-title">Notification</div>
      <div class="report-success-text" id="action-modal-text">Action completed successfully.</div>
      <button class="report-submit-btn" type="button" onclick="closeActionModal()"><i class="ti ti-check"></i> Okay</button>
    </div>
  </div>

</div>
<script src="js/storage.js"></script>
<script src="js/units.js"></script>
<script src="js/language.js"></script>
<script src="js/show-tree-details-in-map.js"></script>
<script src="js/map.js"></script>
<script src="js/tree-in-wikipedia.js"></script>
<script src="js/tree-profile.js"></script>
</body>
</html>
