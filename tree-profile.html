<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Tree Profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/tree-profile.css" />
</head>
<body>
<div class="screen">
  <div class="status-bar blue" id="sbar"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>

  <!-- TREE PROFILE -->
  <div class="page active" id="page-profile">
    <div id="header">
      <div class="topbar"><button class="back-btn" onclick="goBack()"><i class="ti ti-arrow-left"></i></button><span class="topbar-title" id="profile-id-label"></span><span style="margin-left:auto;display:flex;gap:6px"><button class="add-care-btn" type="button" onclick="addToCare()" title="Care for this tree"><i class="ti ti-heart-handshake"></i></button><button class="add-sponsor-btn" type="button" onclick="addToSponsor()" title="Sponsor this tree"><i class="ti ti-currency-rupee"></i></button><button class="add-report-btn" type="button" onclick="addToComplaint()" title="Report issue"><i class="ti ti-phone"></i></button></span></div>
      <div class="hero"><div style="position:absolute;inset:0;background:linear-gradient(135deg,#2d5a1b,#3B6D11,#1e3d0f);"></div><div class="hero-overlay"></div><div class="hero-title"><h1 id="profile-hero-title"></h1><p id="profile-hero-addr"></p></div></div>
    </div>
    <div class="scrollable" style="padding:12px 14px 20px;">
      <div class="stats-row"><div class="stat-card"><div class="stat-label">Health</div><div class="stat-value" id="profile-stat-health">healthy</div></div><div class="stat-card"><div class="stat-label">Height</div><div class="stat-value"><span id="profile-stat-height">8.4</span></div></div><div class="stat-card"><div class="stat-label">Diameter</div><div class="stat-value"><span id="profile-stat-diam">22</span></div></div></div>
      <div class="health-bar-wrap"><div class="health-label"><span>Health score</span><span id="profile-health-score" style="color:#3B6D11;font-weight:500">82 / 100</span></div><div class="health-bar"><div class="health-fill"></div></div></div>
      <div id="display-data">
        <div class="section-title">Tree info</div>
        <div class="info-card" style="margin-bottom:14px;">
          <div class="info-row"><span class="info-key"><i class="ti ti-leaf" style="font-size:0.8667rem"></i>Species name</span><span class="info-val" id="profile-species">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-user" style="font-size:0.8667rem"></i>Registered by</span><span class="info-val" id="profile-registered-by">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-id" style="font-size:0.8667rem"></i>User id</span><span class="info-val" id="profile-user-id">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-calendar" style="font-size:0.8667rem"></i>Registered Date</span><span class="info-val" id="profile-registered-date">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-plant-2" style="font-size:0.8667rem"></i>Planted date</span><span class="info-val" id="profile-planted-date">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-hourglass" style="font-size:0.8667rem"></i>Age</span><span class="info-val" id="profile-age">—</span></div>
          <div class="info-row"><span class="info-key"><i class="ti ti-clipboard-list" style="font-size:0.8667rem"></i>Total logs</span><span class="info-val" id="profile-total-logs">—</span></div>
        </div>
        <div class="section-title">Growth logs</div>
        <div class="info-card">
          <div id="profile-logs"></div>
        </div>
      </div>
      <div style="font-size:0.7333rem;color:var(--color-text-secondary);text-align:center;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px;"><i class="ti ti-hand-click" style="font-size:0.8rem"></i> Tap a log to view photos</div>
      <button class="care-cta" type="button" onclick="addToCare()"><i class="ti ti-heart-handshake"></i> Care for this tree</button>
      <button class="sponsor-cta" type="button" onclick="addToSponsor()"><i class="ti ti-currency-rupee"></i> Sponsor this tree</button>
      <button class="report-cta" type="button" onclick="openComplaintPage()"><i class="ti ti-phone"></i> Report issue</button>
    </div>
  </div>

  <!-- PHOTO FULLSCREEN MODAL -->
  <div class="map-modal-back photo-modal" id="photo-modal" onclick="closePhotoModal()"><button class="photo-close-btn" type="button" onclick="event.stopPropagation(); closePhotoModal()"><i class="ti ti-x"></i></button><div id="photo-modal-emoji" class="photo-modal-emoji"></div></div>

  <!-- TREE MAP FULLSCREEN MODAL -->
  <div class="map-modal-back" id="map-modal">
    <div class="map-modal-head">
      <button class="back-btn" onclick="closeMapModal()"><i class="ti ti-arrow-left"></i></button>
      <span class="topbar-title">Tree map</span>
    </div>
    <iframe class="map-frame" id="map-frame" title="Tree map"></iframe>
  </div>

  <!-- ACTION MODAL -->
  <div class="report-modal-back" id="action-modal">
    <div class="report-success-sheet">
      <div class="report-success-icon" id="action-modal-icon"><i class="ti ti-check"></i></div>
      <div class="report-success-title" id="action-modal-title">Notification</div>
      <div class="report-success-text" id="action-modal-text">Action completed successfully.</div>
      <button class="report-submit-btn" type="button" onclick="closeActionModal()"><i class="ti ti-check"></i> Okay</button>
    </div>
  </div>

</div>
<script src="js/storage.js"></script>
<script src="js/lang.js"></script>
<script src="js/show-tree-details.js"></script>
<script src="js/map.js"></script>
<script src="js/tree-profile.js"></script>
</body>
</html>
