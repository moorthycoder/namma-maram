<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Register</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<style>
  :root {
    --color-theme: #3B6D11;
    --color-theme-dark: #1e3d0f;
    --color-theme-light: #EAF3DE;
    --color-theme-accent: #C0DD97;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f4f4f4;
    --color-text-primary: #111111;
    --color-text-secondary: #666666;
    --color-border-tertiary: #e0e0e0;
    --color-border-secondary: #cccccc;
    --border-radius-md: 10px;
    --border-radius-lg: 14px;
    --font-sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
  html { font-size: 15px; }
  body { background: #e8e8e8; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 24px 0; }
  .phone { background: #1a1a1a; border-radius: 36px; padding: 10px; width: 320px; box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,0.3); }
  .screen { background: var(--color-background-primary); border-radius: 28px; overflow: hidden; height: 600px; display: flex; flex-direction: column; position: relative; }
  .status-bar { padding: 10px 20px 4px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .status-bar span { font-size: 0.7333rem; font-weight: 500; color: var(--color-text-primary); }
  .status-bar.dark span { color: var(--color-theme-light); }
  .page { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .scrollable { overflow-y: auto; flex: 1; }
  .back-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; color: var(--color-text-primary); border: none; flex-shrink: 0; }
  .back-btn.inv { background: rgba(255,255,255,0.12); color: var(--color-theme-light); }
  .dash-header{background:var(--color-theme-dark);padding:12px 14px 16px;flex-shrink:0;}
  .hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hub-tile { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; text-align: center; min-height: 96px; }
  .hub-tile:hover { border-color: var(--color-theme); }
  .hub-tile i { font-size: 1.3333rem; color: var(--color-theme); }
  .hub-tile span { font-size: 0.8rem; font-weight: 500; color: var(--color-text-primary); }
  .hub-tile small { font-size: 0.6rem; color: var(--color-text-secondary); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status-bar dark"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>
    <div class="page">
      <div class="dash-header">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><button class="back-btn inv" onclick="history.back()"><i class="ti ti-arrow-left"></i></button></div>
        <h2 style="font-size:1.2rem;font-weight:500;color:var(--color-theme-light);">Register</h2>
        <p style="font-size:0.8rem;color:rgba(192,221,151,0.6);margin-top:3px;">Choose an account to create</p>
      </div>
      <div class="scrollable" style="flex:1;padding:16px 14px;">
        <div class="hub-grid">
          <div class="hub-tile" onclick="location.href='sponsor.html?hub=register'"><i class="ti ti-heart"></i><span>Sponsor</span><small>Support and donate</small></div>
          <div class="hub-tile" onclick="location.href='care-giver.html?hub=register'"><i class="ti ti-stethoscope"></i><span>Care-giver</span><small>Adopt and care</small></div>
          <div class="hub-tile" onclick="location.href='ten-trees-ranger.html?hub=register'"><i class="ti ti-topology-star"></i><span>Ten Tree Ranger</span></div>
          <div class="hub-tile" onclick="location.href='project-leader.html?hub=register'"><i class="ti ti-users-group"></i><span>Project Leader</span><small>Manage projects</small></div>
          <div class="hub-tile" onclick="location.href='ranger.html?hub=register'"><i class="ti ti-shield-checkered"></i><span>Ranger</span><small>Log field data</small></div>
          <div class="hub-tile" onclick="location.href='surveyor.html?hub=register'"><i class="ti ti-clipboard-list"></i><span>Surveyor</span><small>Survey field data</small></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
