<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  #map { height: 100%; width: 100%; }
  .giw { text-align: center; }
  .giw b { display: block; font-size: 14px; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  function initMap() {
    var src = new URLSearchParams(location.search).get('coords') || '';

    var coords = src.split('|')
      .filter(function(p){ return p && p.indexOf(',') > -1; })
      .map(function(p){ var a = p.split(','); return { lat: parseFloat(a[0]), lng: parseFloat(a[1]) }; })
      .filter(function(c){ return !isNaN(c.lat) && !isNaN(c.lng); });

    if (!coords.length) {
      document.getElementById('map').innerHTML = '<div style="padding:40px;font-size:15px;">No coordinates provided.</div>';
      return;
    }

    var map = L.map('map').fitBounds(coords.map(function(c){ return [c.lat, c.lng]; }));

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    coords.forEach(function(c, i) {
      var marker = L.marker([c.lat, c.lng]).addTo(map);
      marker.bindPopup('<div class="giw"><b>Tree ' + (i + 1) + '</b>' + c.lat.toFixed(4) + ', ' + c.lng.toFixed(4) + '</div>');
    });
  }

  initMap();
</script>
</body>
</html>
