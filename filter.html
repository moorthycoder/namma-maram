<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700&display=swap" />
<link rel="stylesheet" href="css/filter.css" />
</head>
<body>
<div class="screen">
    <div class="status-bar dark" id="sbar"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>

    <!-- MAIN - ALBUM PAGE -->
    <div class="page active" id="page-main">
      <div class="main-hero" id="main-hero">
        <div class="main-logo"><div class="tree-emoji">🌴</div></div>
        <div class="main-titles">
          <div class="main-title-ta"><span class="ta-stylish">நம்ம</span> மரம்</div>
          <div class="main-title">Namma Maram</div>
          <div class="main-sub">Nature and us are one and same</div>
        </div>
      </div>

      <div class="album-filters">
        <form autocomplete="off" onsubmit="return false">
          <div class="filter-row" style="flex-direction:column;gap:8px;">
            <div class="clear-wrap">
              <input class="id-input" id="album-place" type="text" placeholder="Type Place, Pincode, Project or Tree Id" autocomplete="off" oninput="onInput(this)" onkeyup="onInput(this)" />
              <button class="clear-btn" type="button" onclick="clearInput('album-place')" disabled>&times;</button>
              <div class="album-suggest" id="album-suggest"></div>
            </div>
            <div class="clear-wrap">
              <input class="id-input" id="album-tree" type="text" placeholder="Type Tree Name" autocomplete="off" oninput="onInput(this)" onkeyup="onInput(this)" />
              <button class="clear-btn" type="button" onclick="clearInput('album-tree')" disabled>&times;</button>
            </div>
          </div>
        </form>
      </div>

      <div class="album-container">
        <div class="album-header">
          <span class="album-title"><i class="ti ti-search"></i> Search Results</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="album-count" id="album-count">0 trees</span>
            <button class="album-toggle" id="summary-toggle" type="button" onclick="toggleSummary()"><i class="ti ti-eye"></i></button>
          </span>
        </div>

        <div class="search-overlay" id="search-overlay"><i class="ti ti-loader-2 spin"></i><span>Searching…</span></div>
        <div class="album-summary" id="album-summary"></div>
        <div class="album-grid" id="album-grid"></div>
      </div>
    </div>

    <!-- TREE MAP FULLSCREEN MODAL -->
    <div class="map-modal-back" id="map-modal">
      <div class="map-modal-head">
        <button class="back-btn" onclick="closeMapModal()"><i class="ti ti-arrow-left"></i></button>
        <span class="topbar-title">Tree map</span>
      </div>
      <iframe class="map-frame" id="map-frame" title="Tree map"></iframe>
    </div>

  </div>
<script src="js/storage.js"></script>
<script src="js/lang.js"></script>
<script src="js/show-tree-details.js"></script>
<script src="js/map.js"></script>
<script src="js/filter.js"></script>
</body>
</html>
