<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/filter.css" />
</head>
<body>
<div class="screen">
    <div class="status-bar dark" id="sbar"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>

    <!-- MAIN - ALBUM PAGE -->
    <div class="page active" id="page-main">
      <div class="main-header" id="main-hero">
        <button class="back-btn inv hidden" id="filter-back" type="button" onclick="filterBack()"><i class="ti ti-arrow-left"></i></button>
        <div class="main-header-center">
          <div class="header-logo"><div class="tree-emoji">🌴</div></div>
          <div class="header-titles">
            <div class="header-title-ta"><span class="ta-stylish">நம்ம</span> மரம்</div>
            <div class="header-title">Namma Maram</div>
          </div>
        </div>
      </div>

      <div class="album-filters">
        <form autocomplete="off" onsubmit="return false">
          <div class="filter-row filter-row-stack">
            <div class="clear-wrap">
              <input class="id-input" id="album-place" type="text" placeholder="Place, Pincode, Project or Tree Id" autocomplete="off" oninput="onInput(this)" onkeyup="onInput(this)" />
              <button class="clear-btn" type="button" onclick="clearInput('album-place')" disabled>&times;</button>
              <div class="album-suggest" id="album-suggest"></div>
            </div>
            <div class="tree-search-row">
              <div class="clear-wrap tree-search-input">
                <input class="id-input" id="album-tree" type="text" placeholder="Tree Name" autocomplete="off" oninput="onInput(this)" onkeyup="onInput(this)" />
                <button class="clear-btn" type="button" onclick="clearInput('album-tree')" disabled>&times;</button>
                <div class="album-suggest" id="album-suggest-tree"></div>
              </div>
              <a href="scan-qr.html?parent=filter.html" class="scan-qr-mini-btn" role="button">Scan QR</a>
            </div>
          </div>
        </form>
      </div>

      <div class="album-container">
        <div class="album-header">
          <span class="album-title"><i class="ti ti-search"></i> Search Results</span>
          <span class="album-controls">
            <span class="album-count" id="album-count"><span class="album-count-line">0 species</span><span class="album-count-line">0 trees</span></span>
            <button class="album-toggle" id="summary-toggle" type="button" onclick="toggleSummary()"><i class="ti ti-eye"></i></button>
            <button class="album-toggle" id="logs-back-btn" type="button" onclick="filterLogsBack()" title="Back to results"><i class="ti ti-arrow-left"></i></button>
          </span>
        </div>

        <div class="search-overlay" id="search-overlay"><i class="ti ti-loader-2 spin"></i><span>Searching…</span></div>
        <div class="album-summary" id="album-summary"></div>
        <div class="album-grid" id="album-grid"></div>
      </div>
      <div class="album-container hidden" id="album-logs">
        <div class="album-header">
          <span class="album-title"><button class="album-toggle" type="button" onclick="filterLogsBack()" title="Back to results"><i class="ti ti-arrow-left"></i></button><span id="album-logs-title">Logs</span></span>
        </div>
        <div class="album-grid" id="album-logs-list"></div>
      </div>
    </div>

    <!-- TREE MAP FULLSCREEN MODAL -->
    <div class="map-modal-back" id="map-modal">
      <div class="map-modal-head">
        <button class="back-btn" onclick="closeMapModal()"><i class="ti ti-arrow-left"></i></button>
        <span class="topbar-title">Tree map</span>
      </div>
      <iframe class="map-frame" id="map-frame" title="Tree map"></iframe>
    </div>

    <!-- PHOTO FULLSCREEN MODAL -->
    <div class="map-modal-back photo-modal" id="photo-modal" onclick="closePhotoModal()">
      <button class="photo-close-btn" type="button" onclick="event.stopPropagation(); closePhotoModal()"><i class="ti ti-x"></i></button>
      <div id="photo-modal-emoji" class="photo-modal-emoji"></div>
    </div>

  </div>
<script src="js/storage.js"></script>
<script src="js/units.js"></script>
<script src="js/language.js"></script>
<script src="js/show-tree-details-in-map.js"></script>
<script src="js/map.js"></script>
<script src="js/tree-in-wikipedia.js"></script>
<script src="js/filter2.js"></script>
</body>
</html>
