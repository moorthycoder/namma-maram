<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/index.css" />
<style>
.page { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.page.active { display: flex; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; flex-shrink: 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.scrollable { overflow-y: auto; flex: 1; min-height: 0; }
.flow-scroll { padding: 12px 13px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.green-btn { width: 100%; padding: 12px; border-radius: var(--border-radius-lg); background: var(--color-theme); color: var(--color-theme-light); font-size: 0.9333rem; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status-bar dark"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>
    <div class="page active" id="page-start">
      <div class="topbar"><button class="back-btn" onclick="goTo(roleDash())"><i class="ti ti-arrow-left"></i></button><span class="topbar-title">Append Flow Test</span></div>
      <div class="scrollable flow-scroll" style="justify-content:center;align-items:center;text-align:center;gap:16px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--color-theme-light);display:flex;align-items:center;justify-content:center;font-size:1.8667rem;">🧪</div>
        <div style="font-size:1.1333rem;font-weight:500;color:var(--color-text-primary);">Flows + GIS — Test Bed 4</div>
        <div style="font-size:0.8rem;color:var(--color-text-secondary);line-height:1.5;max-width:240px;">Test the standalone GIS flow.</div>
        <button class="green-btn" onclick="openGIS()"><i class="ti ti-gps"></i> GIS</button>
      </div>
    </div>
    <nav class="main-bottomnav">
      <button class="bottomnav-btn active" type="button" onclick="goNav('filter.html')"><i class="ti ti-home"></i><span>Home</span></button>
      <button class="bottomnav-btn" type="button" onclick="openLangPopup()"><i class="ti ti-language"></i><span>Language</span></button>
      <button class="bottomnav-btn" type="button" onclick="goNav('login-hub.html')"><i class="ti ti-login"></i><span>Login</span></button>
      <button class="bottomnav-btn" type="button" onclick="goNav('register-hub.html')"><i class="ti ti-user-plus"></i><span>Register</span></button>
      <button class="bottomnav-btn" type="button" onclick="goNav('settings.html')"><i class="ti ti-settings"></i><span>Settings</span></button>
    </nav>
    <div class="lang-popup-back" id="lang-popup">
      <div class="lang-popup-card">
        <div class="lang-popup-head"><span class="topbar-title">Choose Language</span><button class="back-btn" onclick="closeLangPopup()"><i class="ti ti-x"></i></button></div>
        <div class="lang-grid" id="lang-grid"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/lang.js"></script>
<script src="js/index-nav.js"></script>
<script>
function roleDash() { return 'test-bed-4.html'; }
function goTo(page) {
  if (page === 'test-bed-4.html') { window.location.href = 'test-bed-4.html'; return; }
  backToStart();
}
function openGIS() {
  var p = new URLSearchParams(location.search);
  var userid = p.get('userid') || 'SRV-TEST-003';
  var appLang = p.get('appLang') || 'ta';
  var frame = document.createElement('iframe');
  frame.className = 'app-frame';
  frame.id = 'app-frame';
  frame.title = 'GIS';
  frame.src = 'GIS.html?parent=test-bed-4.html&userid=' + encodeURIComponent(userid) + '&appLang=' + encodeURIComponent(appLang);
  var startPage = document.getElementById('page-start');
  startPage.style.display = 'none';
  startPage.parentNode.insertBefore(frame, startPage.nextSibling);
}
function backToStart() {
  var frame = document.getElementById('app-frame');
  if (frame) { frame.parentNode.removeChild(frame); }
  document.getElementById('page-start').style.display = 'flex';
}
</script>
</body>
</html>
