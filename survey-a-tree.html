<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Survey A Tree</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<style>
:root {
  --color-theme: #3B6D11;
  --color-theme-dark: #1e3d0f;
  --color-theme-light: #EAF3DE;
  --color-theme-accent: #C0DD97;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f4f4f4;
  --color-text-primary: #111111;
  --color-text-secondary: #666666;
  --color-border-tertiary: #e0e0e0;
  --color-border-secondary: #cccccc;
  --border-radius-md: 10px;
  --border-radius-lg: 14px;
  --font-sans: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
html { font-size: 16px; }
html, body { height: 100%; }
body { background: var(--color-background-primary); overflow: hidden; }
.screen { background: var(--color-background-primary); height: 100%; display: flex; flex-direction: column; position: relative; }
.page { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.page.active { display: flex; }
.scrollable { overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
.back-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; color: var(--color-text-primary); border: none; flex-shrink: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; flex-shrink: 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.topbar-title { font-size: 1rem; font-weight: 500; color: var(--color-text-primary); }
.topbar-step { margin-left: auto; font-size: 0.7333rem; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 3px 10px; border-radius: 20px; }
.green-btn { width: 100%; padding: 12px; border-radius: var(--border-radius-lg); background: var(--color-theme); color: var(--color-theme-light); font-size: 0.9333rem; font-weight: 500; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
.ghost-btn { width: 100%; padding: 11px; border-radius: var(--border-radius-lg); background: transparent; color: var(--color-text-secondary); font-size: 0.8667rem; border: 0.5px solid var(--color-border-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.scrollable.flow-scroll { min-height: 0; }
.page .selfie-cam { min-height: 390px; }
</style>
</head>
<body>
  <div class="screen" id="screen"></div>
<script src="js/survey-a-tree.js"></script>
<script>
var parentUrl = new URLSearchParams(location.search).get('parent') || 'test-bed.html';
window._surveyUserId = new URLSearchParams(location.search).get('userid') || 'GRR-2024-081';
window._surveyTreeId = new URLSearchParams(location.search).get('treeid') || '';

function roleDash() {
  return parentUrl;
}

function surveyGoTo(page) {
  if (page && /\.html/.test(page)) { window.location.href = page; return; }
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  var el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
}
window.goTo = surveyGoTo;
goTo('start');
</script>
</body>
</html>
