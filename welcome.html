<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namma Maram · Welcome</title>
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/welcome.css" />
</head>
<body>
  <div class="welcome-card">
    <!-- icon -->
    <div class="icon-wrapper">
      <i class="ti ti-tree"></i>
    </div>

    <!-- brand chip -->
    <div class="brand-chip">
      <div class="lang-section-ta">
        <div class="app-title-ta">நம்ம மரம்</div>
        <div class="caption-ta">
          <i class="ti ti-leaf caption-icon-left"></i>
          அறிவோம் & ஆதரிப்போம்
          <i class="ti ti-leaf caption-icon-right"></i>
        </div>
      </div>

      <div class="lang-section-en">
        <h1 class="app-name">Namma Maram</h1>
        <div class="caption-en">know & care</div>
      </div>
    </div>

    <!-- enter button pointing to filter.html -->
    <a href="filter.html" class="enter-btn" role="button">
      <i class="ti ti-arrow-right"></i> Enter
    </a>

    <!-- subtle footer -->
    <div class="welcome-footer">
      <i class="ti ti-point-filled footer-dot"></i>
      <span>Tree Tracker</span>
      <i class="ti ti-point-filled footer-dot"></i>
    </div>
  </div>

  <script src="js/welcome.js"></script>
</body>
</html>
