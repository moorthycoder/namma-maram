<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/login-hub.css" />
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status-bar dark"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>
    <div class="page">
      <div class="dash-header">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><button class="back-btn inv" onclick="history.back()"><i class="ti ti-arrow-left"></i></button></div>
        <h2 style="font-size:1.2rem;font-weight:500;color:var(--color-theme-light);">Login</h2>
        <p style="font-size:0.8rem;color:rgba(192,221,151,0.6);margin-top:3px;">Choose an account to continue</p>
      </div>
      <div class="scrollable" style="flex:1;padding:16px 14px;">
        <div class="hub-grid">
          <div class="hub-tile" onclick="location.href='sponsor.html?hub=login'"><i class="ti ti-heart"></i><span>Sponsor</span><small>Support and donate</small></div>
          <div class="hub-tile" onclick="location.href='care-giver.html?hub=login'"><i class="ti ti-stethoscope"></i><span>Care-giver</span><small>Adopt and care</small></div>
          <div class="hub-tile" onclick="location.href='ten-trees-ranger.html?hub=login'"><i class="ti ti-topology-star"></i><span>Ten Tree Ranger</span></div>
          <div class="hub-tile" onclick="location.href='project-leader.html?hub=login'"><i class="ti ti-users-group"></i><span>Project Leader</span><small>Manage projects</small></div>
          <div class="hub-tile" onclick="location.href='ranger.html?hub=login'"><i class="ti ti-shield-checkered"></i><span>Ranger</span><small>Log field data</small></div>
          <div class="hub-tile" onclick="location.href='surveyor.html?hub=login'"><i class="ti ti-clipboard-list"></i><span>Surveyor</span><small>Survey field data</small></div>
          <div class="hub-tile" onclick="location.href='admin.html?hub=login'"><i class="ti ti-shield-lock"></i><span>App Admin</span><small>System management</small></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
