<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Namma Maram · Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/login-hub.css" />
<script src="js/login-hub.js"></script>
</head>
<body>
<div class="screen">
    <div class="status-bar dark"><span>9:41</span><span><i class="ti ti-wifi"></i> <i class="ti ti-battery-2"></i></span></div>
    <div class="page">
      <div class="dash-header">
        <div class="flex-row"><button class="back-btn inv" onclick="history.back()"><i class="ti ti-arrow-left"></i></button></div>
        <h2 class="dash-title">Login</h2>
        <p class="dash-sub">Choose an account to continue</p>
      </div>
      <div class="scrollable enroll-scroll">
        <div class="hub-grid">
          <div class="hub-tile"><i class="ti ti-currency-rupee"></i><span>Sponsor</span><small>Support and donate</small></div>
          <div class="hub-tile"><i class="ti ti-heart-handshake"></i><span>Care-giver</span><small>Adopt and care</small></div>
          <div class="hub-tile"><i class="ti ti-stars"></i><span>Ten Tree Ranger</span><small>Be Citizen Vigilant</small></div>
          <div class="hub-tile"><i class="ti ti-users-group"></i><span>Project Leader</span><small>Manage projects</small></div>
          <div class="hub-tile"><i class="ti ti-shield-checkered"></i><span>Ranger</span><small>Log field data</small></div>
          <div class="hub-tile"><i class="ti ti-clipboard-list"></i><span>Surveyor</span><small>Survey field data</small></div>
          <div class="hub-tile"><i class="ti ti-shield-lock"></i><span>App Admin</span><small>System management</small></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
